services:
  asspp:
    image: ghcr.io/lakr233/assppweb:latest
    ports:
      - "8080:8080"
    volumes:
      - ./mnt/asspp-data:/data
    environment:
      - DATA_DIR=/data
      - PORT=8080
      - ANISETTE_URL=http://anisette:6969
      # - DOWNLOAD_THREADS=8
      # - ACCESS_PASSWORD=your_password_here
    restart: unless-stopped
    depends_on:
      anisette:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "5"

  anisette:
    image: dadoum/anisette-v3-server:latest
    volumes:
      - anisette-data:/home/Alcoholic/.config/anisette-v3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6969/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "16m"
        max-file: "3"

volumes:
  anisette-data:
